<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QCare - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">QCare</div>

        <div class="subtitle">
            Admin Login
        </div>

        <form id="adminLoginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                id="loginBtn"
            >
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                const loginBtn =
                    document.getElementById("loginBtn");

                message.textContent = "";

                loginBtn.disabled = true;
                loginBtn.textContent = "Logging in...";

                try {

                    const response =
                        await fetch("/admin-login", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        });

                    const data =
                        await response.json();

                    if (!data.success) {

                        message.textContent =
                            data.message;

                        message.style.color =
                            "#dc2626";

                        loginBtn.disabled = false;
                        loginBtn.textContent = "Login";

                        return;
                    }

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );

                    localStorage.setItem(
                        "adminData",
                        JSON.stringify(data.admin)
                    );

                    message.textContent =
                        "Admin login successful!";

                    message.style.color =
                        "#16a34a";

                    window.location.href =
                        "admin-dashboard.html";

                }
                catch (error) {

                    console.error(
                        "Admin login error:",
                        error
                    );

                    message.textContent =
                        "Unable to connect to QCare server.";

                    message.style.color =
                        "#dc2626";

                    loginBtn.disabled = false;
                    loginBtn.textContent = "Login";

                }

            });

    </script>

</body>
</html>
