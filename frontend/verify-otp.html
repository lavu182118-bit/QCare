<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QCare - Verify OTP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #12558a;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Verify OTP</h1>

        <p class="subtitle">
            Enter the OTP sent to your registered email.
        </p>

        <form onsubmit="verifyOTP(event)">

            <label for="email">Registered Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter registered email"
                required
            >

            <label for="otp">OTP</label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <div id="message"></div>

        <a href="hospital login.html" class="back">
            Back to Hospital Login
        </a>

    </div>

    <script>

        window.onload = function () {

            const email =
                new URLSearchParams(window.location.search).get("email");

            if (email) {
                document.getElementById("email").value = email;
                document.getElementById("email").readOnly = true;
            }

        };


        async function verifyOTP(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const otp =
                document.getElementById("otp").value.trim();

            const message =
                document.getElementById("message");


            message.style.color = "#1769aa";

            message.textContent =
                "Verifying OTP...";


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:3000/verify-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                otp: otp
                            })
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

    message.style.color = "green";

    message.textContent =
        "OTP verified successfully.";

    setTimeout(() => {
        window.location.href =
    "reset-password.html?email=" +
    encodeURIComponent(email);
    }, 1000);

}

                else {

                    message.style.color = "red";

                    message.textContent =
                        data.message ||
                        "Invalid OTP.";

                }

            } catch (error) {

                console.error(error);

                message.style.color = "red";

                message.textContent =
                    "Unable to connect to QCare server.";

            }

        }

    </script>

</body>
</html>
