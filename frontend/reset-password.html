<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QCare - Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #12558a;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Reset Password</h1>

        <p class="subtitle">
            Enter your reset token and create a new password.
        </p>

        <form onsubmit="resetPassword(event)">

            

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

        <div id="message"></div>

        <a href="hospital login.html" class="back">
            Back to Hospital Login
        </a>

    </div>

    <script>

        async function resetPassword(event) {

    event.preventDefault();

    const email =
        new URLSearchParams(window.location.search).get("email");

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (!email) {

        message.style.color = "red";

        message.textContent =
            "Email information is missing.";

        return;
    }


    if (password !== confirmPassword) {

        message.style.color = "red";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    message.style.color = "#1769aa";

    message.textContent =
        "Processing...";


    try {

        const response =
            await fetch(
                "http://127.0.0.1:3000/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            message.style.color = "green";

            message.textContent =
                "Password reset successfully.";

        } else {

            message.style.color = "red";

            message.textContent =
                data.message ||
                "Unable to reset password.";

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.textContent =
            "Unable to connect to QCare server.";

    }

}
    </script>

</body>
</html>
