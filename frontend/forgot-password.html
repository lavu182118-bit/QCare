<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QueueCare - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef6ff;
        }

        .box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f82;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>QueueCare</h1>

        <p class="subtitle">
            Forgot Password
        </p>

        <form onsubmit="forgotPassword(event)">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter hospital email"
                required
            >

            <button type="submit">
                Continue
            </button>

            <div id="message"></div>

        </form>

        <div class="back">
            <a href="hospital login.html">
                ← Back to Hospital Login
            </a>
        </div>

    </div>


    <script>

        async function forgotPassword(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const message =
                document.getElementById("message");

            message.textContent = "";
            message.style.color = "";


            try {

                const response =
                    await fetch(
                        "https://qcare-tisd.onrender.com/forgot-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );


                const data =
                    await response.json();
if (data.success) {

    message.style.color = "green";
    message.textContent =
        "Password reset request created successfully.";

    try {

        const otpResponse =
            await fetch(
                "http://127.0.0.1:3000/send-otp",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        email: email
                    })
                }
            );

        const otpData =
            await otpResponse.json();

        if (otpData.success) {

            setTimeout(() => {

                window.location.href =
                    "verify-otp.html?email=" +
                    encodeURIComponent(email);

            }, 1000);

        } else {

            message.style.color = "red";

            message.textContent =
                otpData.message ||
                "Unable to generate OTP.";

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.textContent =
            "Unable to generate OTP.";

    }
}

                

                 else {

                    message.style.color =
                        "red";

                    message.textContent =
                        data.message ||
                        "Unable to process request.";

                }


            } catch (error) {

                console.error(
                    "Forgot password error:",
                    error
                );

                message.style.color =
                    "red";

                message.textContent =
                    "Unable to connect to QueueCare server.";

            }

        }

    </script>

</body>
</html>
